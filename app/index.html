<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spectrum Home Ed: Family app</title>
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --bg:#f5f7f6;--surface:#fff;--ink:#16323a;--muted:#4e6870;--line:#d6e0df;--accent:#1f7a8c;--accent-ink:#fff;
  --good:#2f7d4f;--warn:#a86b00;--bad:#b3263e;
  --a1:#f2a65a;--a2:#e7c95b;--a3:#7cc49a;--a4:#5fb3c9;--a5:#7f8fd6;--a6:#c487c9;
  --tint:#e7f2f4;--h:#fbe1e6;--p:#fbf4d6;--i:#e3f3e9;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c20;--surface:#162a30;--ink:#e6f0f0;--muted:#a3babd;--line:#28414a;--accent:#5cc3d6;--accent-ink:#0f1c20;--tint:#183139;--h:#3a1f27;--p:#363017;--i:#1b3326;--good:#7fd6a2;--warn:#f2c46a;--bad:#f0788c;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,38px)}h2{font-size:24px}h3{font-size:19px}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px}
.bars{display:flex;gap:2px;height:20px;align-items:flex-end}.bars i{display:block;width:4px;border-radius:2px}
.navr{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);min-width:0}
.navr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
main{padding-block:24px 64px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.banner{background:var(--p);border-radius:12px;padding:10px 14px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;font:700 16px var(--body);border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);color:var(--ink)}
.btn.danger{border-color:var(--line);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{font:400 16px var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.kid{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
.kid:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--ink)}
.chip.x{display:inline-flex;gap:6px;align-items:center}
.chip.x button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.levels{grid-template-columns:1fr}}
.level{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.level:has(input:checked){border-color:var(--accent);background:var(--tint)}
.level b{display:block}
.level span{font-size:14px;color:var(--muted)}
.plans{display:flex;flex-direction:column;gap:8px}
.planrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.planrow:hover{border-color:var(--accent)}
.cover{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.area{border-radius:12px;padding:8px 10px;border:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:6px}
.area.ok{background:var(--i)}.area.miss{background:var(--h)}
.area b{font-variant-numeric:tabular-nums}
.daytabs{display:flex;gap:6px;flex-wrap:wrap}
.daytabs button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 14px;font:700 15px var(--body);cursor:pointer}
.daytabs button[aria-pressed=true]{border-color:var(--accent);background:var(--tint)}
.lesson{display:flex;flex-direction:column;gap:10px}
.lesson dl{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:0;font-size:16px}
.lesson dt{font-weight:700;color:var(--muted)}
.lesson dd{margin:0;min-width:0;overflow-wrap:anywhere}
.lesson ol{margin:0;padding-left:20px}
@media (max-width:560px){.lesson dl{grid-template-columns:1fr}.lesson dt{margin-top:6px}}
.hpi{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.reqcard{text-decoration:none;color:inherit}
.big{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.evgrid figure{margin:0;display:flex;flex-direction:column;gap:4px}
.evgrid img,.evgrid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000}
@media print{.evgrid video{display:none}.evgrid figure{break-inside:avoid}}
.term input[type=text],.term textarea{width:100%}
@media print{.term{break-inside:avoid-page}}
.psec textarea{width:100%;font:16px/1.55 var(--body);padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:120px}
.ptext{white-space:pre-wrap}
.printonly{display:none}
@media print{.printonly{display:block}.psec{border:0!important;padding:0!important;box-shadow:none!important}.toast{display:none!important}}
.dues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.due{padding:8px 10px;border-radius:10px;background:var(--bg);border-left:4px solid var(--line)}
.due.soon{border-left-color:#d99a2b}
.due.late{border-left-color:var(--bad)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.step.done{opacity:.75}
.step p{margin:0;max-width:70ch}
.tick{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tick input{width:22px;height:22px;flex:none;margin-top:2px}
.apphelp{background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--accent);font-weight:700}
.links{margin:0;padding-left:20px}
.evi{position:relative;margin:0;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.evi img,.evi video{width:100%;height:100%;object-fit:cover;display:block}
.evi video{background:#000}
.evx{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer}
.evadd{width:96px;height:96px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;padding:6px;cursor:pointer;color:var(--muted)}
.evadd:hover{border-color:var(--accent);color:var(--accent)}
.evadd:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.hpi button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font:700 14px var(--body);cursor:pointer}
.hpi button[aria-pressed=true][data-r=H]{background:var(--h);border-color:var(--bad)}
.hpi button[aria-pressed=true][data-r=P]{background:var(--p);border-color:var(--warn)}
.hpi button[aria-pressed=true][data-r=I]{background:var(--i);border-color:var(--good)}
.hpi button[aria-pressed=true][data-r=skipped]{background:var(--line)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm{background:var(--h);border-radius:12px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:700}
.authbox{max-width:440px;margin:0 auto}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
@media print{
  header.top,.noprint,.hpi,.daytabs,.btn{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .card{border:1px solid #999;break-inside:avoid}
  .day[hidden]{display:block!important}
}
</style>
</head>
<body>
<header class="top"><div class="wrap nav">
  <a class="brand" href="../"><span class="bars" aria-hidden="true"><i style="height:9px;background:var(--a1)"></i><i style="height:13px;background:var(--a2)"></i><i style="height:17px;background:var(--a3)"></i><i style="height:20px;background:var(--a4)"></i><i style="height:17px;background:var(--a5)"></i><i style="height:13px;background:var(--a6)"></i></span>Spectrum Home Ed</a>
  <div class="navr" id="acct" hidden><span id="acctEmail"></span><button class="btn quiet small" id="signOut">Sign out</button></div>
</div></header>
<main><div class="wrap" id="view" aria-live="polite"></div></main>
<footer class="wrap noprint" style="padding-block:28px 40px;font-size:14px;color:var(--muted)"><a href="../terms.html">Terms of Use</a> · <a href="../privacy.html">Privacy Policy</a> · <a href="mailto:hello@spectrumhomeed.com">hello@spectrumhomeed.com</a></footer>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="planner-data.js"></script>
<script src="state-guides.js"></script>
<script>
(() => {
const C = window.SHE_CONFIG || {};
const LIVE = !!(C.supabaseUrl && C.supabaseAnonKey && window.supabase);
const FW = window.SHE_FRAMEWORKS, SUP = window.SHE_SUPPORT;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view = $("view");
let tt; function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2));
/* Shrink photos on the phone before upload: longest side 1600px, JPEG. Also drops location data stored in the photo. */
function shrinkImage(file){ return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image();
  im.onload = () => { const max = 1600, sc = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const cv = document.createElement("canvas");
    cv.width = Math.round(im.naturalWidth * sc); cv.height = Math.round(im.naturalHeight * sc); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url); cv.toBlob(b => b ? res(b) : rej(new Error("Couldn't read that photo.")), "image/jpeg", 0.82); };
  im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Couldn't read that photo. Try a JPEG or PNG.")); }; im.src = url; }); }
function videoSeconds(file){ return new Promise(res => { const v = document.createElement("video"); v.preload = "metadata"; const url = URL.createObjectURL(file);
  v.onloadedmetadata = () => { URL.revokeObjectURL(url); res(v.duration || 0); }; v.onerror = () => { URL.revokeObjectURL(url); res(0); }; v.src = url; }); }

/* ---------- data layer ---------- */
let db, user = null;
if (LIVE) {
  const sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
  const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };
  db = {
    sb,
    async session(){ const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    async signUp(email, password){ const r = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + location.pathname } }); if (r.error) throw r.error; return r.data; },
    async signIn(email, password){ const r = await sb.auth.signInWithPassword({ email, password }); if (r.error) throw r.error; return r.data.user; },
    async reset(email){ const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (r.error) throw r.error; },
    async newPassword(password){ const r = await sb.auth.updateUser({ password }); if (r.error) throw r.error; },
    async signOut(){ await sb.auth.signOut(); },
    async children(){ return must(await sb.from("children").select("*").order("created_at")); },
    async child(id){ return must(await sb.from("children").select("*").eq("id", id).single()); },
    async saveChild(c){ const { id, ...rest } = c; return id ? must(await sb.from("children").update(rest).eq("id", id).select().single()) : must(await sb.from("children").insert(rest).select().single()); },
    async deleteChild(id){ await this.purgeEvidence("child_id", id); must(await sb.from("children").delete().eq("id", id)); },
    async plans(childId){ return must(await sb.from("plans").select("id,child_id,week_start,title,source,created_at").eq("child_id", childId).order("week_start", { ascending:false })); },
    async plan(id){ return must(await sb.from("plans").select("*").eq("id", id).single()); },
    async savePlanContent(id, content){ return must(await sb.from("plans").update({ content, title: content.title }).eq("id", id).select().single()); },
    async deletePlan(id){ await this.purgeEvidence("plan_id", id); must(await sb.from("plans").delete().eq("id", id)); },
    /* photo and video evidence (private bucket, folder = parent's user id) */
    async evidence(planId){
      const rows = must(await sb.from("evidence").select("*").eq("plan_id", planId).order("created_at"));
      if (!rows.length) return rows;
      const { data: urls } = await sb.storage.from("evidence").createSignedUrls(rows.map(r => r.path), 3600);
      const map = Object.fromEntries((urls || []).map(u => [u.path, u.signedUrl]));
      return rows.map(r => ({ ...r, url: map[r.path] || "" }));
    },
    async addEvidence(child, planId, key, lesson, file){
      const isVideo = file.type.startsWith("video/");
      const body = isVideo ? file : await shrinkImage(file);
      const ext = isVideo ? ((file.name.match(/\.(\w{2,4})$/) || [])[1] || "mp4").toLowerCase() : "jpg";
      const type = isVideo ? (file.type || "video/mp4") : "image/jpeg";
      const me = (await sb.auth.getUser()).data.user;
      const path = `${me.id}/${child.id}/${uuid()}.${ext}`;
      const up = await sb.storage.from("evidence").upload(path, body, { contentType: type, upsert: false });
      if (up.error) throw new Error(/size|exceed/i.test(up.error.message) ? "That file is too big. Videos can be up to 60 MB, about a minute of phone video." : up.error.message);
      const r = await sb.from("evidence").insert({ child_id: child.id, plan_id: planId, lesson_key: key, lesson_title: (lesson.title || "").slice(0, 120), areas: lesson.areas || [], kind: isVideo ? "video" : "photo", path, bytes: body.size });
      if (r.error) { await sb.storage.from("evidence").remove([path]); throw new Error(r.error.message); }
    },
    async removeEvidence(row){ await sb.storage.from("evidence").remove([row.path]); must(await sb.from("evidence").delete().eq("id", row.id)); },
    async purgeEvidence(col, val){
      const rows = must(await sb.from("evidence").select("path").eq(col, val));
      for (let i = 0; i < rows.length; i += 100) await sb.storage.from("evidence").remove(rows.slice(i, i + 100).map(r => r.path));
    },
    async setMediaConsent(childId){ must(await sb.from("children").update({ media_consent_at: new Date().toISOString() }).eq("id", childId)); },
    async logs(planId){ return must(await sb.from("lesson_logs").select("*").eq("plan_id", planId)); },
    async log(planId, key, rating, note){ return must(await sb.from("lesson_logs").upsert({ plan_id: planId, lesson_key: key, rating, note }, { onConflict:"plan_id,lesson_key" }).select().single()); },
    async generate(child, week, focus, extra, onProgress){
      const r = await sb.functions.invoke("generate-plan", { body:{ child_id: child.id, week_start: week, focus, extra } });
      if (r.error) { let msg = r.error.message, code; try { const b = await r.error.context.json(); if (b.error) msg = b.error; code = b.code; } catch(e){} const err = new Error(msg); err.code = code; throw err; }
      if (r.data?.plan) return r.data.plan;
      const jobId = r.data?.job_id; if (!jobId) throw new Error("The planner didn't start. Please try again.");
      const j = await this.waitJob(jobId, onProgress); return { id: j.plan_id };
    },
    // Plans and programs are written in the background. Check every few seconds for up to 8 minutes.
    async waitJob(jobId, onProgress){
      for (let i = 0; i < 120; i++) {
        await new Promise(res => setTimeout(res, 4000));
        const { data: j } = await sb.from("plan_jobs").select("status,progress,plan_id,program_id,error").eq("id", jobId).maybeSingle();
        if (!j) continue;
        if (typeof onProgress === "function") onProgress(j.progress || 0);
        if (j.status === "done" && (j.plan_id || j.program_id || j.year_plan_id || j.report_id)) return j;
        if (j.status === "failed") throw new Error(j.error || "The writer had a problem. Please try again.");
      }
      throw new Error("This is taking longer than usual. Check back in a few minutes; it will appear when it's ready.");
    },
    async writeProgram(child, answers){
      const r = await sb.functions.invoke("generate-plan", { body:{ kind: "program", child_id: child.id, answers } });
      if (r.error) { let msg = r.error.message, code; try { const b = await r.error.context.json(); if (b.error) msg = b.error; code = b.code; } catch(e){} const err = new Error(msg); err.code = code; throw err; }
      const j = await this.waitJob(r.data.job_id); return { id: j.program_id };
    },
    async yearPlan(childId, year){ const r = await sb.from("year_plans").select("*").eq("child_id", childId).eq("year", year).maybeSingle(); if (r.error) throw new Error(r.error.message); return r.data; },
    async saveYear(id, content){ return must(await sb.from("year_plans").update({ content, updated_at: new Date().toISOString() }).eq("id", id).select().single()); },
    async writeYear(child, year, extra){
      const r = await sb.functions.invoke("generate-plan", { body:{ kind: "year", child_id: child.id, year, extra } });
      if (r.error) { let msg = r.error.message, code; try { const b = await r.error.context.json(); if (b.error) msg = b.error; code = b.code; } catch(e){} const err = new Error(msg); err.code = code; throw err; }
      return this.waitJob(r.data.job_id);
    },
    async reportData(childId, from, to){
      const plans = must(await sb.from("plans").select("*").eq("child_id", childId).gte("week_start", from).lte("week_start", to).order("week_start"));
      const ids = plans.map(p => p.id);
      const logs = ids.length ? must(await sb.from("lesson_logs").select("*").in("plan_id", ids)) : [];
      let ev = must(await sb.from("evidence").select("*").eq("child_id", childId).gte("taken_on", from).lte("taken_on", to).order("taken_on"));
      if (ev.length) { const { data: urls } = await sb.storage.from("evidence").createSignedUrls(ev.map(r => r.path), 3600); const map = Object.fromEntries((urls || []).map(u => [u.path, u.signedUrl])); ev = ev.map(r => ({ ...r, url: map[r.path] || "" })); }
      const years = [...new Set([from.slice(0,4), to.slice(0,4)].map(Number))];
      const yps = must(await sb.from("year_plans").select("year,content").eq("child_id", childId).in("year", years));
      return { plans, logs, ev, yps };
    },
    async reports(childId){ return must(await sb.from("reports").select("*").eq("child_id", childId).order("created_at", { ascending:false })); },
    async saveReport(id, content){ return must(await sb.from("reports").update({ content, updated_at: new Date().toISOString() }).eq("id", id).select().single()); },

    async deleteChild(id){ const d = load(); const pids = d.plans.filter(p => p.child_id === id).map(p => p.id); d.children = d.children.filter(x => x.id !== id); d.plans = d.plans.filter(p => p.child_id !== id); d.logs = d.logs.filter(l => !pids.includes(l.plan_id)); save(d); },

    async evidence(){ return []; },

    async logs(planId){ return load().logs.filter(l => l.plan_id === planId); },

/* ---------- helpers ---------- */
const age = y => y ? (new Date().getFullYear() - y) : null;
function mondayOf(dt){ const d = new Date(dt); const day = d.getDay(); const diff = day === 0 ? 1 : (day === 1 ? 0 : 8 - day); d.setDate(d.getDate() + diff); return d; }
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const daysTo = d => Math.round((new Date(d).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 864e5);
const whenTxt = d => { const n = daysTo(d); return n < 0 ? `${-n} day${n === -1 ? "" : "s"} overdue` : n === 0 ? "today" : n <= 60 ? `in ${n} day${n === 1 ? "" : "s"}` : `by ${d.toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" })}`; };
const dueRow = d => { const n = daysTo(d.due), cls = d.info ? "" : n < 0 ? "late" : n <= 30 ? "soon" : ""; return `<li class="due ${cls}"><b>${esc(d.title)}</b> <span class="muted">${d.info ? d.due.toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" }) : whenTxt(d.due)}</span></li>`; };
const nice = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" }); };
function coverage(content){ const areas = content.areas || []; const n = Object.fromEntries(areas.map(a => [a, 0])); (content.days||[]).forEach(d => (d.lessons||[]).forEach(l => { const as = (l.areas||[]).filter(a => a in n); as.forEach(a => n[a] += (l.minutes || 0) / as.length); })); return n; }
const hm = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? ` ${r}m` : ""}` : `${r}m`; };
const banner = () => LIVE ? "" : `<p class="banner noprint"><b>Demo mode.</b> Everything is saved on this device only, and plans come from a built-in template. Accounts and the AI planner switch on once the app is connected.</p>`;
async function guard(fn){ try { await fn(); } catch(e){ console.error(e); view.innerHTML = `<div class="card stack"><h2>Something went wrong</h2><p>${esc(e.message)}</p><p><a class="btn" href="#/">Back to your family</a></p></div>`; } }

  VIC: "The VRQA has optional Word templates for learning plans. You can paste these sections into a template or send this as your own plan.",
  QLD: "Queensland Home Education has optional templates. You can paste these sections into a template or attach this as your summary.",
  NT: "The NT asks you to use its teaching, learning and assessment plan for your child's year level. Paste these sections into that form.",

  TAS: "Each heading matches one of the Registrar's standards. Keep the headings bold when you paste it into your HESP."

/* ---------- Progress report ---------- */
function compileReport(data, areasList){
  const RL = { H: "Full help", P: "Prompted", I: "Independent", skipped: "Skipped" };
  const logBy = {}; data.logs.forEach(l => logBy[l.plan_id + "|" + l.lesson_key] = l);
  const rows = [];
  data.plans.forEach(p => (p.content?.days || []).forEach((d, di) => (d.lessons || []).forEach((l, k) => {
    const lg = logBy[p.id + "|" + `${di}-${k}`]; if (!lg || (!lg.rating && !lg.note)) return;
    const date = new Date(p.week_start + "T00:00:00"); date.setDate(date.getDate() + di);
    rows.push({ date: iso(date), title: l.title, areas: l.areas || [], minutes: l.minutes || 0, rating: lg.rating, note: lg.note || "" }); })));
  rows.sort((a, b) => a.date.localeCompare(b.date));
  const blank = () => ({ lessons: 0, minutes: 0, H: 0, P: 0, I: 0, ev: [] });
  const areas = {}; (areasList || []).forEach(a => areas[a] = blank());
  rows.forEach(r => { if (!r.rating || r.rating === "skipped") return; const share = r.minutes / Math.max(1, r.areas.length);
    r.areas.forEach(a => { const x = areas[a] ||= blank(); x.lessons++; x.minutes += share; x[r.rating]++; }); });
  data.ev.forEach(e => (e.areas?.length ? e.areas : ["Other"]).forEach(a => (areas[a] ||= blank()).ev.push(e)));
  const rated = rows.filter(r => ["H","P","I"].includes(r.rating)); const half = Math.floor(rated.length / 2);
  const pct = list => list.length ? Math.round(list.filter(r => r.rating === "I").length / list.length * 100) : null;
  const trend = { first: pct(rated.slice(0, half)), second: pct(rated.slice(half)), n: rated.length };
  const counts = { H: 0, P: 0, I: 0, skipped: 0 }; rows.forEach(r => { if (r.rating) counts[r.rating]++; });
  const goals = data.yps.flatMap(y => (y.content?.terms || []).map((t, i) => `${y.year} Term ${i + 1} (${t.theme}): ${(t.goals || []).join("; ")}`));
  const facts = [
    `Weekly plans in this period: ${data.plans.length}. Lessons recorded: ${rows.length} (independent ${counts.I}, prompted ${counts.P}, full help ${counts.H}, skipped ${counts.skipped}).`,
    trend.n >= 6 ? `Share of lessons done independently: ${trend.first}% in the first half of the period, ${trend.second}% in the second half.` : "",
    "By learning area:", ...Object.entries(areas).filter(([, x]) => x.lessons || x.ev.length).map(([a, x]) => `- ${a}: ${x.lessons} lessons, about ${Math.round(x.minutes / 60 * 10) / 10} hours (independent ${x.I}, prompted ${x.P}, full help ${x.H}), ${x.ev.length} photos/videos. Example lessons: ${[...new Set(rows.filter(r => r.areas.includes(a)).map(r => r.title))].slice(0, 6).join("; ")}`),
    goals.length ? "Term goals from the year plan:\n" + goals.map(g => "- " + g).join("\n") : "",
    "Parent's notes (date, lesson, help level, note):", ...rows.filter(r => r.note).slice(-80).map(r => `- ${r.date}, ${r.title}, ${RL[r.rating] || "not rated"}: ${r.note}`),
    data.ev.length ? `Photos and videos: ${data.ev.length}, for example: ${data.ev.slice(0, 20).map(e => `${e.taken_on} ${e.lesson_title || ""}`).join("; ")}` : ""
  ].filter(Boolean).join("\n");
  return { rows, areas, trend, counts, facts };
}

    <section class="card stack"><h2>Written summary</h2>
      ${rep ? rep.content.sections.map((x, i) => `<div class="stack psec" style="gap:6px"><h3>${esc(x.heading)}</h3><textarea class="noprint" data-i="${i}" rows="6">${esc(x.body)}</textarea><div class="printonly ptext">${esc(x.body)}</div></div>`).join("") + `<div class="row noprint"><button class="btn primary" type="button" id="rSave">Save changes</button></div>`
        : `<p class="small muted">${R.rows.length ? `We'll write a summary from ${esc(c.name)}'s records for this period: an overview, progress in each learning area, communication and independence, wellbeing and next steps. It only uses what you've recorded.` : "Record how lessons went on your weekly plans, and the summary will be written from those records."}</p>`}
      ${R.rows.length ? `<div class="row noprint"><button class="btn ${rep ? "" : "primary"}" type="button" id="rWrite">${rep ? "Rewrite the summary" : "Write the summary"}</button><span id="rWait" hidden><span class="spinner"></span> Writing. Usually 1 to 2 minutes.</span></div><p id="rMsg" role="alert" style="color:var(--bad)"></p>` : ""}
    </section>
    <section class="card stack"><h2>Learning areas</h2>

          view.innerHTML = `<div class="authbox stack"><h1>Your account has been deleted</h1><p>Everything about your family has been removed. Thank you for using Spectrum Home Ed.</p><p><a href="../">Back to the home page</a></p></div>`;
          $("acct").hidden = true;
        } catch(e){ $("delMsg").textContent = e.message; $("delGo").disabled = false; } };
    }; };
    bindDel();
    view.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { period = b.dataset.p; draw(); });
    view.querySelectorAll("[data-plan]").forEach(b => b.onclick = async () => { b.disabled = true; $("bMsg").textContent = ""; try { const r = await db.billing({ plan: b.dataset.plan }); location.href = r.url; } catch(e){ $("bMsg").textContent = e.message; b.disabled = false; } });
    if ($("portal")) $("portal").onclick = async () => { try { const r = await db.billing({ action: "portal" }); location.href = r.url; } catch(e){ $("bMsg").textContent = e.message; } };
  };
  draw();
}

const money = c => "A$" + (Math.round(c) / 100).toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function bars(rows, fmt = v => v, label = r => r.label){
  if (!rows.length) return `<p class="muted small">No data yet.</p>`;
  const max = Math.max(...rows.map(r => r.value), 1), W = 640, H = 160, bw = W / rows.length;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H + 34}" style="width:100%;min-width:320px" role="img" aria-label="chart">
    <line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/>
    ${rows.map((r, i) => { const h = Math.max(r.value ? 2 : 0, r.value / max * (H - 18)); const x = i * bw + bw * 0.15; return `<g><title>${esc(label(r))}: ${esc(fmt(r.value))}</title><rect x="${x}" y="${H - h}" width="${bw * 0.7}" height="${h}" rx="3" fill="var(--accent)"/>${rows.length <= 14 || i % Math.ceil(rows.length / 10) === 0 ? `<text x="${x + bw * 0.35}" y="${H + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(label(r))}</text>` : ""}${rows.length <= 14 && r.value ? `<text x="${x + bw * 0.35}" y="${H - h - 4}" text-anchor="middle" font-size="11" fill="var(--ink)">${esc(fmt(r.value))}</text>` : ""}</g>`; }).join("")}
  </svg></div>`;
}
function fillDays(list, days = 30){ const m = Object.fromEntries((list || []).map(d => [d.day, d.n])); const out = []; for (let i = days - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = iso(d); out.push({ label: `${d.getDate()}/${d.getMonth() + 1}`, value: m[k] || 0 }); } return out; }
const tbl = (head, rows) => rows.length ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:15px"><thead><tr>${head.map(h => `<th style="text-align:left;padding:8px;border-bottom:1px solid var(--line);color:var(--muted)">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td style="padding:8px;border-bottom:1px solid var(--line)">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<p class="muted small">Nothing yet.</p>`;
const kpi = (label, value, sub = "") => `<div class="card" style="padding:14px"><p class="small muted">${label}</p><p style="font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums">${value}</p>${sub ? `<p class="small muted">${sub}</p>` : ""}</div>`;

async function adminView(){
  const acc = await db.access();
  if (!acc.is_admin) { view.innerHTML = `<div class="card stack"><h2>Admins only</h2><p><a href="#/">Back to your family</a></p></div>`; return; }
  const r = await db.sb.rpc("admin_dashboard");
  if (r.error) throw new Error(r.error.message);
  const d = r.data, v = d.visits, g = d.registrations, rev = d.revenue;
  let admins = []; try { admins = await db.adminList(); } catch(e){ admins = null; }
  let st = null; try { const q = await db.sb.rpc("admin_storage"); st = q.error ? null : q.data; } catch(e){}
  const gb = b => b >= 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB";
  const me = (user?.email || "").toLowerCase(), OWNER = "daviesgavin@hotmail.com";
  let noTrack = false; try { noTrack = localStorage.getItem("she-no-track") === "1"; } catch(e){}
  view.innerHTML = `<div class="stack" style="gap:24px">
    <p class="small"><a href="#/">← Your family</a></p>
    <div class="row" style="justify-content:space-between"><h1>Admin dashboard</h1><button class="btn quiet small" type="button" id="refresh">Refresh</button></div>

    <div class="stack"><h2>Money</h2><p class="small muted">Paid invoices from Stripe. Currently test mode.</p>
      <div class="kids" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${kpi("Last 7 days", money(rev.week))}${kpi("Last 30 days", money(rev.month))}${kpi("Last 12 months", money(rev.year))}${kpi("Paying families", d.paying)}</div>
      <div class="card stack"><h3>Revenue by month</h3>${bars((rev.by_month || []).map(m => ({ label: m.month.slice(5) + "/" + m.month.slice(2, 4), value: m.cents })), money)}</div>
    </div>

    <div class="stack"><h2>Visits</h2><p class="small muted">Location is estimated from each visitor's time zone. No IP addresses are stored.</p>
      <div class="kids" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${kpi("Today", v.today)}${kpi("Last 7 days", v.week)}${kpi("Last 30 days", v.month, `${v.unique_month} unique visitors`)}${kpi("Last 12 months", v.year)}</div>
      <div class="card stack"><h3>Visits per day, last 30 days</h3>${bars(fillDays(v.by_day))}</div>
      <div class="grid2">
        <div class="card stack"><h3>Top cities (30 days)</h3>${tbl(["City", "Country", "Visits"], (v.by_place || []).map(p => [esc(p.city), esc(p.country), p.n]))}</div>
        <div class="card stack"><h3>Countries (30 days)</h3>${tbl(["Country", "Visits"], (v.by_country || []).map(p => [esc(p.country), p.n]))}<h3 style="margin-top:12px">Top pages</h3>${tbl(["Page", "Visits"], (v.by_page || []).map(p => [esc(p.path), p.n]))}</div>
      </div>
      <label class="row small"><input type="checkbox" id="noTrack" ${noTrack ? "checked" : ""}> Don't count my own visits on this device</label>
    </div>

    ${st ? `<div class="stack"><h2>Photo and video storage</h2><p class="small muted">Your Supabase Pro plan includes 100 GB. Beyond that, storage is charged per GB each month.</p>
      <div class="kids" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${kpi("Space used", gb(st.bytes), `${Math.round(st.bytes / 1e9)}% of 100 GB`.replace(/^0%/, "Under 1%"))}${kpi("Photos", st.photos)}${kpi("Videos", st.videos)}${kpi("Families using it", st.families)}</div></div>` : ""}

    <div class="stack"><h2>Registrations</h2>
      <div class="kids" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${kpi("Total accounts", g.total)}${kpi("Last 7 days", g.week)}${kpi("Last 30 days", g.month)}</div>
      <div class="card stack"><h3>Sign-ups per day, last 30 days</h3>${bars(fillDays(g.by_day))}</div>
      <div class="card stack"><h3>Newest accounts</h3>${tbl(["Email", "Joined", "Children", "Plans"], (g.recent || []).map(u => [esc(u.email), nice(u.created_at.slice(0, 10)), u.children, u.plans]))}</div>
    </div>

    <div class="stack"><h2>Paying customers</h2>
      <div class="card stack">${tbl(["Email", "Plan", "Status", "Location", "Renews"], (d.customers || []).map(c => [esc(c.email || "—"), esc(c.plan === "plus" ? "Family Plus" : c.plan === "family" ? "Family" : (c.plan || "—")), esc(c.status), esc([c.city, c.state, c.country].filter(Boolean).join(", ") || "—"), c.current_period_end ? nice(c.current_period_end.slice(0, 10)) : "—"]))}</div>
      <div class="card stack"><h3>Revenue by location</h3>${tbl(["State", "Country", "Customers", "Revenue"], (rev.by_place || []).map(p => [esc(p.state || "—"), esc(p.country), p.customers, money(p.cents)]))}</div>
    </div>

    <div class="stack" id="compSection"><h2>Free access list</h2><p class="muted">People on this list never pay and get unlimited AI plans. They need to sign up with exactly this email address.</p>
      <form class="card stack" id="compForm" novalidate>
        <div class="grid2"><label class="f">Email <input type="email" id="compEmail" required></label><label class="f">Note <small>Optional, e.g. "beta tester", "therapist"</small><input type="text" id="compNote" maxlength="120"></label></div>
        <label class="f">Free until <small>Optional. Leave empty for no end date.</small><input type="date" id="compExp"></label>
        <p id="compMsg" role="alert" style="color:var(--bad)"></p>
        <div><button class="btn primary" type="submit">Add to free list</button></div>
      </form>
      <div class="plans">${(d.comp || []).map(c => `<div class="planrow"><span><b>${esc(c.email)}</b><br><span class="muted small">${esc(c.note || "")}${c.expires_on ? ` · until ${nice(c.expires_on)}` : " · no end date"}</span></span>${c.email === (user?.email || "").toLowerCase() ? `<span class="chip">You</span>` : `<button class="btn danger small" type="button" data-rm="${esc(c.email)}">Remove</button>`}</div>`).join("") || `<p class="muted">Nobody on the list yet.</p>`}</div>
    </div>

    <div class="stack" id="adminSection"><h2>Admins</h2><p class="muted">Admins can see this whole dashboard, including every family's email address and payments, and can manage both lists. Only add people you trust. They sign in with this email address like any parent, then see the Admin button.</p>
      ${admins === null ? `<p class="muted">Run supabase/admins.sql to turn on admin management.</p>` : `
      <form class="card stack" id="admForm" novalidate>
        <div class="grid2"><label class="f">Email <input type="email" id="admEmail" required></label><label class="f">Note <small>Optional, e.g. "co-founder"</small><input type="text" id="admNote" maxlength="120"></label></div>
        <p id="admMsg" role="alert" style="color:var(--bad)"></p>
        <div><button class="btn primary" type="submit">Add admin</button></div>
      </form>
      <div class="plans">${admins.map(a => `<div class="planrow"><span><b>${esc(a.email)}</b><br><span class="muted small">${esc(a.note || "")}${a.added_by ? `${a.note ? " · " : ""}added by ${esc(a.added_by)}` : ""}</span></span>${a.email === OWNER ? `<span class="chip">Owner</span>` : a.email === me ? `<span class="chip">You</span>` : `<span id="admRm-${esc(a.email)}"><button class="btn danger small" type="button" data-arm="${esc(a.email)}">Remove</button></span>`}</div>`).join("")}</div>`}
    </div>
  </div>`;
  if ($("admForm")) $("admForm").onsubmit = async e => { e.preventDefault(); const em = $("admEmail").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) { $("admMsg").textContent = "Enter a valid email address."; return; }
    try { await db.adminAdd(em, $("admNote").value.trim()); toast("Admin added"); adminView(); } catch(err){ $("admMsg").textContent = err.message; } };
  view.querySelectorAll("[data-arm]").forEach(b => b.onclick = () => { const em = b.dataset.arm, box = b.parentElement;
    box.innerHTML = `<span class="small">Remove admin?</span> <button class="btn danger small" type="button">Remove</button> <button class="btn quiet small" type="button">Keep</button>`;
    const [yes, no] = box.querySelectorAll("button");
    no.onclick = () => adminView();
    yes.onclick = async () => { try { await db.adminRemove(em); toast("Admin removed"); } catch(err){ toast(err.message); } adminView(); }; });
  $("refresh").onclick = adminView;
  $("noTrack").onchange = e => { try { e.target.checked ? localStorage.setItem("she-no-track", "1") : localStorage.removeItem("she-no-track"); } catch(err){} toast(e.target.checked ? "Your visits on this device won't be counted" : "Your visits will be counted"); };
  $("compForm").onsubmit = async e => { e.preventDefault(); const em = $("compEmail").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(em)) { $("compMsg").textContent = "Enter a valid email address."; return; }
    try { await db.compAdd(em, $("compNote").value.trim(), $("compExp").value); toast("Added to the free list"); adminView(); } catch(err){ $("compMsg").textContent = err.message; } };
  view.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { await db.compRemove(b.dataset.rm); toast("Removed"); adminView(); });
}

/* ---------- router ---------- */
async function route(){
  const h = location.hash.replace(/^#/, "") || "/";
  if (LIVE && /access_token|type=recovery|error_description/.test(location.hash)) return; // supabase handles the redirect
  if (h === "/new-password") return newPasswordView();
  if (!user) user = await db.session();
  $("acct").hidden = !user; $("acctEmail").textContent = user?.email || "";
  if (!LIVE) $("signOut").hidden = true;
  if (!user) { if (h === "/signup") return authView("up"); if (h === "/reset") return authView("reset"); return authView("in"); }
  window.scrollTo(0, 0);
  let m;
  if (h === "/" || h === "/signin" || h === "/signup") return guard(homeView);
  if (h === "/admin" && LIVE) return guard(adminView);
  if (h.split("?")[0] === "/billing" && LIVE) return guard(billingView);
  if (h === "/child/new") return guard(() => childFormView());
  if ((m = h.match(/^\/child\/([\w-]+)\/edit$/))) return guard(() => childFormView(m[1]));
  if ((m = h.match(/^\/child\/([\w-]+)\/guide$/))) return guard(() => guideView(m[1]));
  if (LIVE && (m = h.match(/^\/child\/([\w-]+)\/program$/))) return guard(() => programFormView(m[1]));
  if (LIVE && (m = h.match(/^\/program\/([\w-]+)$/))) return guard(() => programView(m[1]));
  if (LIVE && (m = h.match(/^\/child\/([\w-]+)\/year\/(\d{4})$/))) return guard(() => yearView(m[1], +m[2]));
  if (LIVE && (m = h.match(/^\/child\/([\w-]+)\/report$/))) return guard(() => reportView(m[1]));
  if ((m = h.match(/^\/child\/([\w-]+)$/))) return guard(() => childView(m[1]));
  if ((m = h.match(/^\/plan\/([\w-]+)$/))) return guard(() => planView(m[1]));
  return guard(homeView);
}
$("signOut").onclick = async () => { await db.signOut(); user = null; location.hash = "#/signin"; route(); };
window.addEventListener("hashchange", route);
route();
})();
</script>
<script src="../track.js" defer></script>
</body>
